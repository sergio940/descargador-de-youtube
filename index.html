<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor de Playlist Completa</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px;
            margin: 0;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 1200px;
            background: #2a2a3e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
        }
        h2 { 
            margin-top: 0; 
            color: #ff4757;
            text-align: center;
        }
        
        .input-group {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        input {
            flex-grow: 1;
            min-width: 250px;
            padding: 15px;
            border: 2px solid #444;
            border-radius: 8px;
            background: #1a1a2e;
            color: white;
            font-size: 16px;
        }
        input:focus {
            outline: none;
            border-color: #ff4757;
        }
        button {
            padding: 15px 30px;
            background: linear-gradient(135deg, #ff4757 0%, #ff6b81 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }
        button:hover { 
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 71, 87, 0.4);
        }

        /* Contenedor principal - Video + Lista */
        .player-container {
            display: none;
            gap: 20px;
            margin-top: 20px;
        }
        
        /* Versión desktop: video arriba, lista abajo */
        .video-wrapper {
            width: 100%;
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
        }
        
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .loader {
            display: none;
            text-align: center;
            padding: 50px;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #444;
            border-top: 5px solid #ff4757;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-msg {
            background: #ff6b6b;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        
        .info-box {
            background: #3a3a5e;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 0.9em;
            border-left: 4px solid #ff4757;
        }

        /* NUEVO: Contenedor específico para que aparezca la lista */
        .playlist-embed-container {
            margin-top: 30px;
            border-radius: 10px;
            overflow: hidden;
            background: #000;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🎬 Visor de Playlist de YouTube</h2>
        
        <div class="input-group">
            <input type="text" id="playlistLink" placeholder="Pega aquí el link de la playlist...">
            <button onclick="cargarPlaylist()">▶ Cargar Lista</button>
        </div>

        <div id="error-msg" class="error-msg"></div>

        <!-- Loader -->
        <div class="loader" id="loader">
            <div class="spinner"></div>
            <p>Cargando playlist completa...</p>
        </div>

        <!-- Reproductor con lista -->
        <div class="player-container" id="player-container">
            <div class="playlist-embed-container">
                <iframe id="youtube-player" 
                    src="" 
                    title="YouTube video player" 
                    frameborder="0" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                    allowfullscreen>
                </iframe>
            </div>
        </div>
        
        <div class="info-box">
            <strong>ℹ️ Información:</strong>
            <p>La lista de reproducción aparecerá debajo del video. Si no la ves, haz clic en el ícono de lista (☰) en la esquina superior derecha del reproductor.</p>
        </div>
    </div>

    <script>
        function cargarPlaylist() {
            const input = document.getElementById('playlistLink').value.trim();
            const container = document.getElementById('player-container');
            const iframe = document.getElementById('youtube-player');
            const errorMsg = document.getElementById('error-msg');
            const loader = document.getElementById('loader');

            errorMsg.style.display = 'none';
            container.style.display = 'none';
            loader.style.display = 'block';

            if (!input) {
                mostrarError('⚠️ Por favor, pega un link de playlist.');
                loader.style.display = 'none';
                return;
            }

            const playlistId = extraerPlaylistId(input);

            if (playlistId) {
                // URL MEJORADA con parámetros para FORZAR la lista
                // index=1 es CLAVE - fuerza a YouTube a mostrar la lista
                const embedUrl = `https://www.youtube.com/embed/videoseries?list=${playlistId}&index=1&autoplay=0&rel=0`;
                
                iframe.src = embedUrl;
                
                setTimeout(() => {
                    loader.style.display = 'none';
                    container.style.display = 'flex';
                    
                    // Ajustar altura del iframe para que quepa la lista
                    // En desktop: más alto para ver video + lista
                    // En móvil: altura normal
                    if (window.innerWidth > 768) {
                        iframe.style.height = '700px';
                    } else {
                        iframe.style.height = '100%';
                    }
                }, 2000);
            } else {
                mostrarError('❌ Link inválido. Debe contener "list=" en la URL.');
                loader.style.display = 'none';
            }
        }

        function extraerPlaylistId(url) {
            const regex1 = /[?&]list=([^&]+)/;
            const match1 = url.match(regex1);
            if (match1 && match1[1]) {
                return match1[1];
            }
            return null;
        }

        function mostrarError(mensaje) {
            const errorMsg = document.getElementById('error-msg');
            errorMsg.innerText = mensaje;
            errorMsg.style.display = 'block';
        }

        document.getElementById('playlistLink').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                cargarPlaylist();
            }
        });
    </script>

</body>
</html>
