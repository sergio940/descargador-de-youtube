<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor de Playlist Completa</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            width: 100%;
            max-width: 900px; /* Ancho suficiente para que quepa la lista al lado */
            background: #2a2a2a;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h2 { margin-top: 0; color: #ff0000; }
        
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input {
            flex-grow: 1;
            padding: 12px;
            border: 1px solid #444;
            border-radius: 5px;
            background: #333;
            color: white;
            font-size: 16px;
        }
        button {
            padding: 12px 25px;
            background-color: #ff0000;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: background 0.3s;
        }
        button:hover { background-color: #cc0000; }

        /* Contenedor del video responsive */
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* Ratio 16:9 */
            height: 0;
            overflow: hidden;
            border-radius: 8px;
            background: #000;
        }
        
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .nota {
            margin-top: 15px;
            font-size: 0.9em;
            color: #aaa;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Cargar Lista de Reproducción</h2>
        <p>Pega el enlace completo de la playlist de YouTube:</p>
        
        <div class="input-group">
            <input type="text" id="playlistLink" placeholder="https://www.youtube.com/playlist?list=...">
            <button onclick="cargarPlaylist()">Cargar Lista</button>
        </div>

        <div id="error-msg" style="color: #ff6b6b; margin-bottom: 10px; display: none;"></div>

        <!-- Aquí aparecerá el reproductor CON LA LISTA AL LADO -->
        <div class="video-wrapper" id="video-container" style="display:none;">
            <iframe id="youtube-player" 
                src="" 
                title="YouTube video player" 
                frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                allowfullscreen>
            </iframe>
        </div>
        
        <p class="nota">Nota: La lista de videos aparecerá a la derecha del video (en PC) o abajo (en móvil) automáticamente.</p>
    </div>

    <script>
        function cargarPlaylist() {
            const input = document.getElementById('playlistLink').value;
            const container = document.getElementById('video-container');
            const iframe = document.getElementById('youtube-player');
            const errorMsg = document.getElementById('error-msg');

            errorMsg.style.display = 'none';

            // 1. Expresión regular para encontrar el ID de la lista
            // Busca "list=" y captura los caracteres alfanuméricos y guiones que siguen
            const regex = /[?&]list=([^&]+)/;
            const match = input.match(regex);

            if (match && match[1]) {
                const playlistId = match[1];
                
                // 2. Construir la URL MÁGICA
                // listType=playlist es lo que fuerza a YouTube a mostrar la lista lateral
                const embedUrl = `https://www.youtube.com/embed?listType=playlist&list=${playlistId}`;
                
                // 3. Cargar en el iframe
                iframe.src = embedUrl;
                container.style.display = 'block';
            } else {
                // Error si el link no tiene "list="
                errorMsg.innerText = "Error: El enlace no parece ser una playlist válida. Asegúrate de que tenga '?list=' en la URL.";
                errorMsg.style.display = 'block';
                container.style.display = 'none';
            }
        }
    </script>

</body>
</html>
